# F021 stock chamber heater control for the DC input on FAN_AC.
# Connect heater AC only after verifying the independent high-limit and airflow interlocks.
[heater_generic chamber_heater]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: watermark
max_delta: 1.0
min_temp: -30
max_temp: 80
max_power: 1.0

[verify_heater chamber_heater]
# The 50 W heater warmed the chamber by 0.44 C over 180 seconds near 33 C.
# Allow for the chamber sensor's startup lag while requiring a measurable rise.
heating_gain: 0.10
check_gain_time: 240
# Near 50-55 C the 50 W heater gains about 0.1 C/min, so the chamber can settle a little
# below target - 5 C. With the default 5 C band that tripped CP2559 mid-print
# (49.6 C at full power against a 55 C target). The wider band keeps the 120 error limit,
# so a heater that stops heating still faults within minutes.
hysteresis: 8

[k2_chamber_bang_bang]
# Enable only when the heater AC load is fed independently of the K2's internal wiring.
external_ac_supply: true
# This assembly has independent hardwired temperature protection and no factory RPM lead.
monitor_factory_chamber_fan: false
